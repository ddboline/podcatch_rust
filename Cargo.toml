[package]
name = "podcatch_rust"
version = "0.6.4"
authors = ["Daniel Boline <ddboline@gmail.com>"]
edition = "2018"

[package.metadata.deb]
name = "podcatch-rust"
priority = "optional"
section = "rust"
provides = "podcatch-rust"
extended-description = """\
CLI Podcatcher written in Rust."""

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1.11"
checksums = "0.9"
clap = {version="4.6", features=["derive"]}
crossbeam-utils = "0.8"
deadpool = "0.13"
deadpool-postgres = "0.14"
deadqueue = "0.2"
derive_more = {version="2.1", features = ["full"]}
dirs = "6.0"
dotenvy = "0.15"
envy = "0.4"
env_logger = "0.11"
futures = "0.3"
itertools = "0.14"
log = "0.4"
postgres_query = {git = "https://github.com/ddboline/rust-postgres-query", tag = "0.3.9", features=["deadpool"]}
rand = "0.10"
refinery = {version="0.9", features=["tokio-postgres"]}
reqwest = {version="0.13", features=["cookies", "json", "stream"]}
roxmltree = "0.21"
serde = {version="1.0", features=["derive"]}
serde_json = "1.0"
smallvec = "1.15"
stack-string = {version="1.1", features=["postgres_types"]}
stdout-channel = "0.6"
thiserror = "2.0"
tokio = {version = "1.52", features=["rt", "macros", "rt-multi-thread"]}
tokio-postgres = "0.7"
walkdir = "2.5"

[[bin]]
name = "podcatch-rust"
path = "src/podcatch_rust.rs"
doc = false
